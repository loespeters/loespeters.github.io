# Site settings for loespeters.github.io

title: Loes Peters
author: Loes Peters

# Links in the navigation bar
navbar-links:
  Research: "/#research"
  Publications: "publications"
  Contact: "contact"

# Links shown in the footer
social-network-links:
  email: "loes.peters@cwi.nl"
  linkedin: loes-peters
  ORCID: "0009-0008-7358-8331"

# Appearance
title-on-all-pages: true
edit_page_button: false
navbar-var-length: false
page-col: "#FFFFFF"
text-col: "#404040"
link-col: "#008AFF"
hover-col: "#0085A1"
navbar-col: "#EAEAEA"
navbar-text-col: "#404040"
navbar-border-col: "#DDDDDD"
footer-col: "#EAEAEA"
footer-text-col: "#777777"
footer-link-col: "#404040"
footer-hover-col: "#0085A1"
# Alternatively, the navbar, footer, and page background can be set to an image
# instead of colour
#navbar-img: "/assets/img/bgimage.png"
#footer-img: "/assets/img/bgimage.png"
#page-img: "/assets/img/bgimage.png"

timezone: "Europe/Amsterdam"
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM

# Every page uses the "page" layout
defaults:
  -
    scope:
      path: ""
    values:
      layout: "page"

# Files that are not part of the website
exclude:
  - aboutme.md
  - tags.html
  - feed.xml
  - staticman.yml
  - Appraisals
  - CHANGELOG.md
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - screenshot.png
  - docs/
  - assets/img/CWI_Loes_Peters_Portrait_MK3_2054.jpg

plugins:
  - jekyll-sitemap
